name = "extract-excel-app-llm-worker"
main = "src/index.ts"
compatibility_date = "2024-08-01"

[ai]
binding = "AI"

[observability]
enabled = true

# Two buckets, picked by the x-tier header the Next worker sends. Keyed by
# x-client-ip (the browser's IP, forwarded by the Next worker) — CF-Connecting-IP
# here is always the Next worker's egress IP, i.e. one bucket for the whole site.
[[ratelimits]]
name = "RL_FREE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_PAID"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[vars]
# Shared secret to authorize requests from Next.js API.
# Set with Wrangler secret instead of committing it:
#   wrangler secret put LLM_API_KEY
